<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Booking</title>
</head>
<body>

    <link rel="stylesheet" href="style.css">
    <h1 class="title">Hotel Room Booking</h1>
<hr>

<form id="bookingForm">
    <label>Customer Name</label><br>
    <input type="text" id="name" required><br><br>

    <label>Phone Number</label><br>
    <input type="tel" id="phone" required><br><br>

    <label>Email</label><br>
    <input type="email" id="email" required><br><br>

    <label>Hotel Name</label><br>
    <select id="hotel" required>
        <option value="">Select Hotel</option>
        <option>Sunrise Grand Hotel</option>
        <option>Ocean View Resort</option>
        <option>Mountain Stay Inn</option>
        <option>Royal Palace Hotel</option>
    </select><br><br>

    <label>Check-in Date</label><br>
    <input type="date" id="checkin" required><br><br>

    <label>Check-out Date</label><br>
    <input type="date" id="checkout" required><br><br>

    <label>Number of Guests</label><br>
    <input type="number" id="guests" min="1" max="10" required><br><br>

    <button type="submit">Book Now</button>
</form>

<h3><a href="currentBooking.html"> Current Booking </a></h3>
<script src="script.js"></script>
</body>
</html>
